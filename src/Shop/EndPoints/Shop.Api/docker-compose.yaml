version: '3.9'

services:
  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerDevelopment
      - SeedDatabase=true
      - ConnectionStrings__DevelopmentConnection=Server=sqlServer;Database=KetabeKhoob;User Id=sa;Password=Admin12345!@#$%;TrustServerCertificate=True
      - Redis__Configuration="redis:6379"
    depends_on:
      - sqlserver
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Admin12345!@#$%"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"

volumes:
  sqlserver-data:

